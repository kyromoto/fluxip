name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted,linux,ubuntu,hcloud-1,fluxip]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxip
          POSTGRES_PASSWORD: fluxip
          POSTGRES_DB: fluxip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKEND_DATABASE_URL: postgresql://fluxip:fluxip@localhost:5432/fluxip
      BACKEND_REDIS_URL: redis://localhost:6379
      BACKEND_CLOUDEVENTS_SOURCE: https://fluxip.example.com
      BACKEND_CLOUDEVENTS_TYPE_PREFIX: space.kyro.fluxip
      BACKEND_LOGTO_ENDPOINT: https://smoke-test.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, required so determine-version.mjs can see prior release tags.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # - name: Test
      #   run: BACKEND_CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)" pnpm --filter fluxip-backend test

      # The self-hosted runner is arm64, so it needs QEMU registered for
      # amd64 to build/emulate that platform (not arm64 — that's native here).
      - name: Set up QEMU (for cross-arch amd64 builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Native (amd64) build only, loaded into the local Docker daemon for the
      # smoke tests below — a multi-platform image can't be `--load`ed (the
      # local image store only ever holds one platform's image), so this is
      # necessarily single-arch. The real multi-arch build+push happens later,
      # after these smoke tests pass, reusing this build's cached layers.
      - name: Build Docker image (amd64, for smoke testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fluxip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend role
        run: |
          set -e
          CONTAINER_ID=$(docker run --rm -d --network host \
            -e BACKEND_DATABASE_URL="$BACKEND_DATABASE_URL" \
            -e BACKEND_REDIS_URL="$BACKEND_REDIS_URL" \
            -e BACKEND_CLOUDEVENTS_SOURCE="$BACKEND_CLOUDEVENTS_SOURCE" \
            -e BACKEND_CLOUDEVENTS_TYPE_PREFIX="$BACKEND_CLOUDEVENTS_TYPE_PREFIX" \
            -e BACKEND_LOGTO_ENDPOINT="$BACKEND_LOGTO_ENDPOINT" \
            -e BACKEND_CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            fluxip:ci node backend/dist/main.js)
          trap 'docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          ok=false
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8080/metrics; then
              ok=true
              break
            fi
            sleep 1
          done
          if [ "$ok" != true ]; then
            echo "Backend smoke test failed: /metrics did not return 200 within 15s"
            docker logs "$CONTAINER_ID" || true
            exit 1
          fi
          echo "Backend smoke test passed"

      - name: Smoke test frontend role
        run: |
          set -e
          CONTAINER_ID=$(docker run --rm -d --network host \
            -e FRONTEND_LOGTO_ENDPOINT=https://smoke-test.invalid \
            -e FRONTEND_LOGTO_APP_ID=smoke-test-app-id \
            -e FRONTEND_LOGTO_API_RESOURCE=https://smoke-test.invalid/api \
            -e FRONTEND_BACKEND_URL=https://smoke-test.invalid/backend \
            fluxip:ci serve --single frontend/dist -l 3000)
          trap 'docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          ok=false
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              ok=true
              break
            fi
            sleep 1
          done
          if [ "$ok" != true ]; then
            echo "Frontend smoke test failed: / did not return 200 within 15s"
            docker logs "$CONTAINER_ID" || true
            exit 1
          fi
          # SPA fallback routing (FR-005): a direct request to a non-root
          # in-app route must still return the app shell, not a 404.
          if ! curl -sf -o /dev/null http://localhost:3000/some/deep/route; then
            echo "Frontend smoke test failed: deep route did not return 200 under serve --single"
            docker logs "$CONTAINER_ID" || true
            exit 1
          fi
          CONFIG_JS=$(curl -sf http://localhost:3000/config.js)
          echo "$CONFIG_JS"
          for value in smoke-test.invalid smoke-test-app-id smoke-test.invalid/api smoke-test.invalid/backend; do
            case "$CONFIG_JS" in
              *"$value"*) ;;
              *)
                echo "Frontend smoke test failed: config.js missing expected value: $value"
                exit 1
                ;;
            esac
          done
          echo "Frontend smoke test passed"

      - name: Determine version
        id: version
        run: node .github/scripts/determine-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.version.outputs.should-release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No step above sets `continue-on-error`, so the default GitHub Actions
      # behavior — a failing step stops the job before any later step runs —
      # is what enforces FR-006: this push step is only ever reached if build,
      # test, the Docker build, and both smoke tests all already succeeded.
      #
      # Builds and pushes both platforms directly to GHCR as one multi-arch
      # manifest (can't `--load` a multi-platform image locally, so this is a
      # separate build from the amd64-only one used for smoke testing above;
      # `cache-from` reuses that build's amd64 layers so only arm64 — built
      # under QEMU emulation — needs real work here).
      - name: Build and push multi-arch image to GHCR
        if: steps.version.outputs.should-release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fluxip:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fluxip:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Must be the last step in the job: only runs (and only creates a tag)
      # once the image push above has already succeeded (FR-014).
      - name: Create Git tag and GitHub Release
        if: steps.version.outputs.should-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.git-tag }}" \
            --title "${{ steps.version.outputs.git-tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
