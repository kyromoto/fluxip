services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxip
      POSTGRES_PASSWORD: fluxip
      POSTGRES_DB: fluxip
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxip"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  logto:
    image: ghcr.io/logto-io/logto:latest
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgresql://fluxip:fluxip@postgres:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    ports:
      - "3001:3001"
      - "3002:3002"

  bull-board:
    image: venatum/bull-board
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BULL_PREFIX: bull
    ports:
      - "3010:3000"

  # One-off admin step: brings the database to the current schema, then exits. The app does not migrate on
  # start any more and refuses to run against an outdated schema (specs/010-admin-cli-healthchecks).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "backend/dist/cli.js", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "backend/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logto:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    # Ready (not just alive): /readyz answers 503 while Postgres or Redis is unreachable. The test lives here
    # and not in the Dockerfile because one image serves both the backend and the frontend role. If
    # BACKEND_BIND_ADDRESS is set to a specific address, use that address instead of 127.0.0.1.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${BACKEND_PORT:-8080}/readyz"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 20s
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - access-log-data:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--single", "frontend/dist", "-l", "3000"]
    # FRONTEND_LOGTO_ENDPOINT/_APP_ID/_API_RESOURCE/_BACKEND_URL (see
    # .env.example) are read by the entrypoint at container start to
    # generate frontend/dist/config.js (specs/006-frontend-runtime-config).
    # Only the FRONTEND_* values are passed on, never the backend's secrets.
    environment:
      FRONTEND_LOGTO_ENDPOINT: ${FRONTEND_LOGTO_ENDPOINT:-}
      FRONTEND_LOGTO_APP_ID: ${FRONTEND_LOGTO_APP_ID:-}
      FRONTEND_LOGTO_API_RESOURCE: ${FRONTEND_LOGTO_API_RESOURCE:-}
      FRONTEND_BACKEND_URL: ${FRONTEND_BACKEND_URL:-}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 20s
    ports:
      - "5173:3000"

volumes:
  postgres-data:
  access-log-data:
