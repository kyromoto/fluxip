services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxip
      POSTGRES_PASSWORD: fluxip
      POSTGRES_DB: fluxip
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxip"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  logto:
    image: ghcr.io/logto-io/logto:latest
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgresql://fluxip:fluxip@postgres:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    ports:
      - "3001:3001"
      - "3002:3002"

  bull-board:
    image: deadly0/bull-board:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BULL_PREFIX: bull
    ports:
      - "3010:3000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "backend/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logto:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - access-log-data:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "-s", "frontend/dist", "-l", "3000"]
    depends_on:
      - app
    ports:
      - "5173:3000"

volumes:
  postgres-data:
  access-log-data:
